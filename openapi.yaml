openapi: 3.0.3
info:
  title: Lume Store · API Gateway
  version: 2.0.0
  description: |
    Every call goes through the **API Gateway**, which validates the token and forwards it to the right microservice:
    `/api/products` → catalog, `/api/orders` → orders, `/api/users` and `/api/auth` → users.

    1. Log in with **POST /api/auth/login** (`cliente@lumestore.dev` / `senha123` or `admin@lumestore.dev` / `admin123`).
    2. Copy the `token`, click **Authorize** and paste it.
    3. Place an order and watch the product stock go down.
servers:
  - url: /
tags:
  - name: Products
    description: Catalog service (public reads, admin-only writes)
  - name: Auth
    description: Users service
  - name: Users
    description: Users service
  - name: Orders
    description: Orders service (talks to the catalog to reserve stock)
  - name: Health

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Produto não encontrado }
    Product:
      type: object
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: Fone over-ear Bluetooth }
        description: { type: string }
        price: { type: number, example: 449.9 }
        stock: { type: integer, example: 40 }
        category: { type: string, example: Áudio }
        image: { type: string, example: /produtos/fone-over-ear.jpg }
        featured: { type: boolean }
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        stock: { type: integer }
        category: { type: string }
        image: { type: string }
        featured: { type: boolean }
      example: { name: Carregador USB-C 65 W, description: Carregamento rápido para notebook e celular., price: 199.9, stock: 30, category: Acessórios, image: /produtos/placeholder.jpg }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        address: { type: string }
        phone: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, paid, shipped, delivered, cancelled] }
        shipping_address: { type: string }
        total: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              name: { type: string }
              image: { type: string }
              quantity: { type: integer }
              unit_price: { type: number }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Status of the gateway and the three microservices
      security: []
      responses:
        '200':
          description: Everything online
          content:
            application/json:
              example: { gateway: online, services: { catalog: online, orders: online, users: online } }
        '503': { description: A service is down }

  /api/products:
    get:
      tags: [Products]
      summary: List products
      security: []
      parameters:
        - { in: query, name: search, schema: { type: string }, example: fone }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: featured, schema: { type: boolean } }
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products: { type: array, items: { $ref: '#/components/schemas/Product' } }
    post:
      tags: [Products]
      summary: Create a product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { description: Not logged in }
        '403': { description: Not an admin }

  /api/products/categories:
    get:
      tags: [Products]
      summary: Categories with their product count
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              example: { categories: [{ name: Áudio, total: 4 }, { name: Eletrônicos, total: 4 }] }

  /api/products/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer }, example: 7 }
    get:
      tags: [Products]
      summary: Product details
      security: []
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { description: Not found }
    put:
      tags: [Products]
      summary: Update a product (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Updated }
        '403': { description: Not an admin }
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      responses:
        '200': { description: Deleted }
        '403': { description: Not an admin }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            example: { email: cliente@lumestore.dev, password: senha123 }
      responses:
        '200':
          description: Session token (valid for 24 h)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { description: Wrong e-mail or password, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      responses:
        '200': { description: Session ended }

  /api/users:
    post:
      tags: [Users]
      summary: Sign up
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 6 }
                address: { type: string }
                phone: { type: string }
            example: { name: Maria Exemplo, email: maria@lumestore.dev, password: exemplo123, address: 'Rua Exemplo, 45 - Campinas/SP' }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '409': { description: E-mail already registered }
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        '200': { description: Users }
        '403': { description: Not an admin }

  /api/users/me:
    get:
      tags: [Users]
      summary: My profile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Not logged in }
    put:
      tags: [Users]
      summary: Update my profile
      requestBody:
        content:
          application/json:
            example: { name: Cliente Lume, address: 'Rua Nova, 10 - São Paulo/SP', phone: '(11) 92222-2222' }
      responses:
        '200': { description: Updated }

  /api/users/me/password:
    patch:
      tags: [Users]
      summary: Change my password
      requestBody:
        content:
          application/json:
            example: { current_password: senha123, new_password: novaSenha123 }
      responses:
        '200': { description: Password changed; other sessions are ended }
        '401': { description: Wrong current password }

  /api/orders:
    get:
      tags: [Orders]
      summary: My orders (admins see all)
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
    post:
      tags: [Orders]
      summary: Place an order
      description: Prices come from the catalog, never from the client. Stock is reserved in the catalog in a single transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer }
                shipping_address: { type: string }
            example: { items: [{ product_id: 7, quantity: 1 }, { product_id: 13, quantity: 1 }], shipping_address: 'Rua de Teste, 123 - São Paulo/SP' }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: Not enough stock, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/orders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Orders]
      summary: Order details
      responses:
        '200': { description: Order }
        '404': { description: Not found or owned by another user }
    delete:
      tags: [Orders]
      summary: Cancel an order (releases the stock)
      responses:
        '200': { description: Cancelled }
        '409': { description: Order already shipped or delivered }

  /api/orders/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [Orders]
      summary: Change the status (admin)
      requestBody:
        content:
          application/json:
            example: { status: shipped }
      responses:
        '200': { description: Status updated }
        '403': { description: Not an admin }
